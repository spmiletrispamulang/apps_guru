<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | Portal Guru Letris Pamulang</title>

  <!-- Favicon -->
  <link rel="icon" href="img/logo.png" type="image/png">

  <!-- Google Font & Icons -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
  
  <!-- Custom CSS Global -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">

  <!-- Navbar -->
  <nav class="main-header navbar navbar-expand navbar-white navbar-light border-bottom-0 shadow-sm">
    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link text-letris-primary" data-widget="pushmenu" href="#" role="button"><i class="fas fa-bars"></i></a>
      </li>
    </ul>
    <ul class="navbar-nav ml-auto">
      <li class="nav-item">
        <button id="btnLogout" class="btn btn-danger btn-sm rounded-pill px-3 shadow-sm font-weight-bold">
          <i class="fas fa-sign-out-alt mr-1"></i> Keluar
        </button>
      </li>
    </ul>
  </nav>

  <!-- Main Sidebar Container -->
  <aside class="main-sidebar sidebar-light-primary elevation-4">
    <!-- Brand Logo -->
    <a href="dashboard.html" class="brand-link bg-letris-primary text-center">
      <img src="img/logo.png" alt="Letris Logo" class="brand-image img-circle elevation-3 bg-white" style="opacity: .9">
      <span class="brand-text font-weight-bold text-white">Portal Guru</span>
    </a>

    <!-- Sidebar -->
    <div class="sidebar">
      <!-- Sidebar user panel -->
      <div class="user-panel mt-3 pb-3 mb-3 d-flex border-bottom align-items-center">
        <div class="image">
          <div class="img-circle elevation-1 bg-letris-primary d-flex justify-content-center align-items-center text-white" style="width: 38px; height: 38px;">
            <i class="fas fa-user-tie"></i>
          </div>
        </div>
        <div class="info">
          <a href="#" class="d-block font-weight-bold text-dark" id="namaGuruDisplay">Memuat...</a>
          <small class="text-muted" id="roleDisplay">Guru</small>
        </div>
      </div>

      <!-- Sidebar Menu -->
      <nav class="mt-2">
        <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu" data-accordion="false">
          <li class="nav-item">
            <a href="dashboard.html" class="nav-link active bg-letris-primary">
              <i class="nav-icon fas fa-tachometer-alt"></i>
              <p>Dashboard <span class="badge badge-warning right text-dark">Aktif</span></p>
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </aside>

  <!-- Content Wrapper -->
  <div class="content-wrapper">
    <div class="content-header">
      <div class="container-fluid">
        <div class="row mb-3 align-items-center mt-2">
          <div class="col-sm-6">
            <h1 class="m-0 font-weight-bold text-dark">Jadwal Mengajar Anda</h1>
            <p class="text-muted mb-0">Silakan pilih kelas di bawah ini untuk memulai sesi pengajaran.</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Main content -->
    <div class="content">
      <div class="container-fluid">
        
        <!-- Notifikasi Error -->
        <div id="errorMessage" class="alert alert-danger d-none shadow-sm rounded"></div>

        <!-- Animasi Loading -->
        <div id="loader" class="loader-container">
          <div class="spinner-border text-letris-primary mb-3" style="width: 3rem; height: 3rem;" role="status"></div>
          <span class="text-muted font-weight-bold">Memuat jadwal kelas...</span>
        </div>

        <!-- Kontainer Kartu Jadwal -->
        <div class="row" id="jadwalContainer">
          <!-- Jadwal akan dimuat di sini oleh Javascript -->
        </div>

      </div>
    </div>
  </div>
  
  <!-- Footer -->
  <footer class="main-footer bg-white text-sm text-center">
    <strong>&copy; 2026 Portal Guru SMK Letris Pamulang.</strong> Hak Cipta Dilindungi.
  </footer>
</div>

<!-- jQuery & Bootstrap -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.1/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>

<!-- Scripts Modular -->
<script src="js/config.js"></script>
<script src="js/dashboard.js"></script>

</body>
</html>
