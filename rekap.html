<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rekap Absensi | Portal Guru Letris Pamulang</title>
  
  <!-- Favicon -->
  <link rel="icon" href="img/logo.png" type="image/png">

  <!-- Google Font & Icons -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  
  <!-- DataTables CSS -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/dataTables.bootstrap4.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.2.2/css/buttons.bootstrap4.min.css">
  
  <!-- Theme style (AdminLTE) & Custom CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
  <link rel="stylesheet" href="css/style.css">
  
  <style>
    /* Styling khusus untuk DataTables agar tombolnya selaras */
    .dt-buttons .btn { border-radius: 6px; }
    table.dataTable thead th { border-bottom: 2px solid #dee2e6; }
  </style>
</head>
<body class="hold-transition layout-top-nav">
<div class="wrapper">
  
  <!-- Navbar -->
  <nav class="main-header navbar navbar-expand-md navbar-white navbar-light border-bottom shadow-sm">
    <div class="container">
      <a href="kelas.html" class="navbar-brand text-letris-primary font-weight-bold">
        <i class="fas fa-arrow-left mr-2"></i>
        <span class="brand-text">Kembali ke Kelas</span>
      </a>
    </div>
  </nav>

  <!-- Content Wrapper -->
  <div class="content-wrapper mt-4">
    <div class="content-header">
      <div class="container">
        <div class="d-flex align-items-center mb-2">
            <div class="mr-3 bg-letris-primary p-3 rounded shadow-sm text-white text-center" style="min-width: 80px;">
                <h3 class="m-0 font-weight-bold" id="kelasTitle">-</h3>
                <small>Kelas</small>
            </div>
            <div>
                <h4 class="m-0 font-weight-bold text-dark">Rekap Riwayat Absensi</h4>
                <p class="text-muted mb-0" id="mapelTitle">Mata Pelajaran: -</p>
            </div>
        </div>
      </div>
    </div>

    <div class="content">
      <div class="container">
        <div class="card card-modern border-top-0" style="border-top: 4px solid #0056b3 !important;">
          <div class="card-body">
            
            <div id="loaderRekap" class="loader-container py-5">
              <div class="spinner-border text-letris-primary mb-3" style="width: 3rem; height: 3rem;" role="status"></div>
              <span class="text-muted font-weight-bold">Mengunduh data rekap dari database...</span>
            </div>
            
            <div class="table-responsive d-none mt-2" id="tableContainer">
              <table id="tableRekap" class="table table-bordered table-hover m-0 w-100 text-sm">
                <!-- Perhatikan penambahan id="rekapHead" di bawah ini -->
                <thead id="rekapHead" class="bg-light text-dark">
                  <!-- Header tabel (Tanggal Pertemuan) akan dibangun secara otomatis oleh Javascript -->
                </thead>
                <tbody id="rekapBody">
                  <!-- Data matriks absensi siswa akan dimuat di sini oleh JS -->
                </tbody>
              </table>
            </div>

            <div id="errorMessage" class="alert alert-warning mt-4 d-none shadow-sm rounded"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Footer -->
  <footer class="main-footer bg-white text-sm text-center border-top">
    <strong>&copy; 2026 Portal Guru SMK Letris Pamulang.</strong> Hak Cipta Dilindungi.
  </footer>
</div>

<!-- jQuery & Bootstrap 4 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.1/js/bootstrap.bundle.min.js"></script>

<!-- DataTables & Export Plugins -->
<script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.11.5/js/dataTables.bootstrap4.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.2.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.2.2/js/buttons.bootstrap4.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.3/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/vfs_fonts.js"></script>
<script src="https://cdn.datatables.net/buttons/2.2.2/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.2.2/js/buttons.print.min.js"></script>

<!-- AdminLTE App -->
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>

<!-- Scripts Modular -->
<script src="js/config.js"></script>
<script src="js/rekap.js"></script>

</body>
</html>
