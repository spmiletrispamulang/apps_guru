<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Portal Guru Letris Pamulang</title>

  <!-- Favicon -->
  <link rel="icon" href="img/logo.png" type="image/png">

  <!-- Font & Frameworks -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
  
  <!-- Custom Global CSS -->
  <link rel="stylesheet" href="css/style.css">
  
  <style>
    /* Spesifik Halaman Login */
    body.login-page { background-color: #e9ecef; }
    .login-box { width: 400px; max-width: 90%; }
    .logo-container img { width: 80px; margin-bottom: 15px; }
  </style>
</head>
<body class="hold-transition login-page">
<div class="login-box">
  
  <div class="card card-modern">
    <div class="card-body login-card-body text-center rounded">
      
      <!-- Logo & Judul Aplikasi -->
      <div class="logo-container mt-2">
        <img src="img/logo.png" alt="Logo Letris Pamulang">
      </div>
      <h4 class="font-weight-bold text-letris-primary mb-0">Portal Guru</h4>
      <p class="text-muted mb-4">SMK Letris Pamulang</p>

      <form id="loginForm">
        <div class="input-group mb-3">
          <input type="text" class="form-control" id="username" placeholder="Username / NIK" required>
          <div class="input-group-append">
            <div class="input-group-text"><span class="fas fa-user text-letris-primary"></span></div>
          </div>
        </div>
        <div class="input-group mb-3">
          <input type="password" class="form-control" id="password" placeholder="Password" required>
          <div class="input-group-append">
            <div class="input-group-text"><span class="fas fa-lock text-letris-primary"></span></div>
          </div>
        </div>
        
        <div class="mt-4 mb-2">
          <button type="submit" id="btnSubmit" class="btn bg-letris-primary btn-block py-2 font-weight-bold shadow-sm">
            Masuk ke Portal <i class="fas fa-sign-in-alt ml-2"></i>
          </button>
        </div>
      </form>

      <div id="alertMessage" class="alert alert-danger mt-3 d-none text-sm" role="alert"></div>
    </div>
  </div>
</div>

<!-- Scripts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.1/js/bootstrap.bundle.min.js"></script>

<!-- Custom JS -->
<script src="js/config.js"></script>
<script src="js/login.js"></script>

</body>
</html>
